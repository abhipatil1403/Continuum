    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<body>
    <header>
        <div class="logo">
            <span>DawaTrack</span>
        </div>
        <div class="user-profile">
            <i class="fas fa-user-circle" id="profileIcon"></i>
        </div>
    </header>

    <main>
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for medicines...">
                <button type="button">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <!-- Reminder Cards -->
        <div class="reminder-cards">
            <!-- Prescription Card -->
            <div class="reminder-card">
                <i class="fas fa-prescription-bottle-alt"></i>
                <h3>Prescription</h3>
                <p>Set reminders for your prescribed medicines</p>
                <button class="set-reminder-btn" data-modal="prescriptionModal">
                    Set Reminder
                </button>
            </div>

            <!-- Medicine Expiry Card -->
            <div class="reminder-card">
                <i class="fas fa-calendar-times"></i>
                <h3>Medicine Expiry</h3>
                <p>Track medicine expiry dates</p>
                <button class="set-reminder-btn" data-modal="expiryModal">
                    Set Reminder
                </button>
            </div>

            <!-- Checkup Card -->
            <div class="reminder-card">
                <i class="fas fa-stethoscope"></i>
                <h3>Check-up</h3>
                <p>Set reminders for medical check-ups</p>
                <button class="set-reminder-btn" data-modal="checkupModal">
                    Set Reminder
                </button>
            </div>
        </div>
    </main>

    <!-- Modal content here... -->
    
    <footer>
        <a href="privacy_policy.html" style="color: var(--text-color); text-decoration: none; opacity: 0.6;">
            Privacy Policy
        </a>
    </footer>

    <script src="script.js"></script>
    <script src="google-config.js"></script>
</body>
</html>
