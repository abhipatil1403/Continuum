[Frontend Components]
User Interface -> Login/Signup Page
Login/Signup Page -> Authentication
Authentication -> Dashboard
Dashboard -> {Medicine Expiry, Prescription Details, Medical Checkup}

[Authentication Flow]
Login -> Supabase Auth
Signup -> Email Confirmation
Email Confirmation -> email-confirmed.html
email-confirmed.html -> Login

[Medicine Expiry Flow]
Medicine Expiry -> Set Reminder Form
Set Reminder Form -> {
    Save to Database,
    Send Email Confirmation,
    Add to Google Calendar
}

[Prescription Flow]
Prescription Details -> Set Reminder Form
Set Reminder Form -> {
    Upload Prescription Image,
    Save Prescription Details,
    Save Medicine Details,
    Send Email Confirmation,
    Add to Google Calendar
}
Upload Prescription Image -> Supabase Storage (prescription_images bucket)

[Medical Checkup Flow]
Medical Checkup -> Set Reminder Form
Set Reminder Form -> {
    Save Appointment Details,
    Send Email Confirmation,
    Add to Google Calendar
}

[Backend Components]
[Supabase Database Tables]
- profiles (user details)
- prescriptions (prescription records)
- prescription_medicines (medicine details)
- medicine_expiry (expiry records)
- checkup (appointment records)

[Supabase Storage]
- prescription_images bucket

[Email System]
Supabase Email Templates -> {
    Signup Confirmation,
    Medicine Expiry Reminder,
    Prescription Reminder,
    Checkup Reminder
}

[Google Calendar Integration]
Google OAuth2 -> {
    Client Authentication,
    Calendar API Access
}
Calendar API -> Create Events

[Reminder System]
Reminder Creation -> {
    1. Save to Database
    2. Send Email Confirmation {
        Success -> Show Success Notification
        Failure -> Show Warning Notification
    }
    3. Add to Google Calendar {
        Success -> Show Success Notification
        Failure -> Show Warning Notification
    }
}

[Search Functionality]
Search Input -> Filter Results
Results Display -> {Medicines, Prescriptions, Appointments}

[User Profile]
Profile Management -> {
    View Profile,
    Update Details,
    Emergency Contact
}

[Security]
- Supabase RLS Policies
- Google OAuth2 Security
- Storage Bucket Policies

[Data Flow]
1. User Input
2. Frontend Validation
3. API Calls
4. Database Operations
5. External Service Integration (Google Calendar)
6. Email Notifications
7. User Feedback (Notifications)

[Error Handling]
- Frontend Validation Errors
- Database Operation Errors
- API Integration Errors
- Storage Operation Errors
- Email Sending Errors
- Calendar Integration Errors

[Notifications System]
Types -> {
    Success (Green),
    Warning (Yellow),
    Error (Red),
    Info (Blue)
}
Display -> {
    Auto-dismiss,
    Stack Multiple,
    Custom Duration
}

[System Flow]
1. User Entry -> {Login, Signup}
2. Authentication Process:
   Login -> Supabase Auth -> Dashboard
   Signup -> Email Verification -> email-confirmed.html -> Login

3. Dashboard Access Points -> {
    Medicine Expiry,
    Prescription Details,
    Medical Checkup,
    User Profile,
    Search
}

[Feature Connections]
1. Medicine Expiry:
   Entry -> Form Input -> Validation -> {
       Database (medicine_expiry table) -> Success/Error
       Email Service -> Success/Error
       Google Calendar -> Success/Error
   }

2. Prescription Details:
   Entry -> Form Input -> {
       Image Upload -> {
           Supabase Storage (prescription_images) -> Success/Error
           Database (prescriptions.prescription_image) -> Success/Error
       }
       Medicine Details -> Database (prescription_medicines) -> Success/Error
       Email Service -> Success/Error
       Google Calendar -> Success/Error
   }

3. Medical Checkup:
   Entry -> Form Input -> Validation -> {
       Database (checkup table) -> Success/Error
       Email Service -> Success/Error
       Google Calendar -> Success/Error
   }

[Service Integrations]
1. Supabase Connections:
   Frontend -> {
       Auth API -> User Management
       Database API -> CRUD Operations
       Storage API -> Image Management
       Email API -> Notifications
   }

2. Google Calendar Connection:
   Frontend -> {
       OAuth2 Flow -> Authentication
       Calendar API -> Event Creation
   }

[Data Flow Connections]
1. User Actions -> Frontend Validation
2. Frontend -> API Calls -> {
    Supabase Services,
    Google Services
}
3. API Responses -> {
    UI Updates,
    Notifications,
    Error Handling
}

[Notification Chain]
User Action -> Operation Result -> {
    Success Path: Green Notification -> Auto Dismiss
    Warning Path: Yellow Notification -> Auto Dismiss
    Error Path: Red Notification -> Manual Dismiss Required
}

[Search Connection]
Search Input -> Database Query -> {
    medicine_expiry table,
    prescriptions table,
    prescription_medicines table,
    checkup table
} -> Results Display

[Profile Management Chain]
Profile Access -> {
    View: profiles table -> Display
    Update: Input -> Validation -> Database Update
    Emergency Contact: Input -> Validation -> Database Update
}

[Security Connections]
1. Authentication:
   User Credentials -> Supabase Auth -> JWT Token -> Protected Routes

2. Database Access:
   API Requests -> RLS Policies -> Data Access

3. Storage Access:
   Image Upload -> Bucket Policies -> Storage Operations

[Error Handling Chain]
Operation Attempt -> {
    Success -> Success Notification
    Failure -> {
        Log Error,
        Show Error Notification,
        Fallback Actions
    }
}

[Reminder System Connections]
Reminder Creation -> {
    Database Entry -> {
        Success -> Email Service
        Failure -> Error Handling
    }
    Email Service -> {
        Success -> Google Calendar
        Failure -> Warning Notification
    }
    Google Calendar -> {
        Success -> Success Notification
        Failure -> Warning Notification
    }
}