<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DawaTrack - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <span>DawaTrack</span>
            </div>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Login</div>
            <div class="auth-tab" data-tab="signup">Sign Up</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required>
                <div class="error-message" id="loginEmailError"></div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-container">
                    <input type="password" id="loginPassword" required>
                    <button type="button" class="password-toggle" data-for="loginPassword">
                        <i class="fas fa-eye-low-vision"></i>
                    </button>
                </div>
                <div class="error-message" id="loginPasswordError"></div>
            </div>

            <button type="submit" class="auth-btn">Login</button>
            
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <input type="text" id="signupName" required>
                <div class="error-message" id="signupNameError"></div>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" required>
                <div class="error-message" id="signupEmailError"></div>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="password-container">
                    <input type="password" id="signupPassword" required>
                    <button type="button" class="password-toggle" data-for="signupPassword">
                        <i class="fas fa-eye-low-vision"></i>
                    </button>
                </div>
                <div class="error-message" id="signupPasswordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-container">
                    <input type="password" id="confirmPassword" required>
                    <button type="button" class="password-toggle" data-for="confirmPassword">
                        <i class="fas fa-eye-low-vision"></i>
                    </button>
                </div>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <button type="submit" class="auth-btn">Sign Up</button>
        </form>
    </div>

    <footer>
        <a href="privacy_policy.html" style="color: var(--text-color); text-decoration: none; opacity: 0.6;">
            Privacy Policy
        </a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
