<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input { width: 300px; padding: 8px; font-size: 16px; }
        #suggestions { border: 1px solid #ccc; max-width: 300px; display: none; background: white; position: absolute; }
        .suggestion-item { padding: 8px; cursor: pointer; }
        .suggestion-item:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <h2>Search Medicine</h2>
    <input type="text" id="searchBox" placeholder="Type a medicine name..." onkeyup="searchMedicine()">
    <div id="suggestions"></div>
    
    <h3>Selected Medicine:</h3>
    <p id="result"></p>

    <script>
        // ✅ Initialize Supabase
        const SUPABASE_URL = 'https://illirjtiwudwybtxvvbf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsbGlyanRpd3Vkd3lidHh2dmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzkyNzIxNTQsImV4cCI6MjA1NDg0ODE1NH0.WH-ZdjR9yvv1iii8pgGIi1IiCxT2hUyF1dyRrHXNG10';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function searchMedicine() {
            let input = document.getElementById("searchBox").value.toLowerCase();
            let suggestionsBox = document.getElementById("suggestions");

            if (input.length < 2) { 
                suggestionsBox.style.display = "none";
                return;
            }

            // ✅ Fetch medicine names matching search input
            let { data, error } = await supabaseClient
                .from("medicine_library")
                .select("name")
                .ilike("name", `%${input}%`); // Case-insensitive search

            if (error) {
                console.error("Error fetching data:", error);
                return;
            }

            // ✅ Show suggestions
            if (data.length > 0) {
                suggestionsBox.innerHTML = data.map(med => `<div class='suggestion-item' onclick="selectMedicine('${med.name}')">${med.name}</div>`).join("");
                suggestionsBox.style.display = "block";
            } else {
                suggestionsBox.style.display = "none";
            }
        }

        async function selectMedicine(name) {
            document.getElementById("searchBox").value = name;
            document.getElementById("suggestions").style.display = "none";

            // ✅ Fetch medicine details including substitutes
            let { data, error } = await supabaseClient
                .from("medicine_library")
                .select("name, substitute0, substitute1, substitute2")
                .eq("name", name)
                .single();

            if (error || !data) {
                document.getElementById("result").innerHTML = "Medicine not found.";
                return;
            }

            // ✅ Display result
            document.getElementById("result").innerHTML = `
                <strong>${data.name}</strong><br>
                Substitute 1: ${data.substitute0 || "N/A"}<br>
                Substitute 2: ${data.substitute1 || "N/A"}<br>
                Substitute 3: ${data.substitute2 || "N/A"}
            `;
        }
    </script>

</body>
</html>
