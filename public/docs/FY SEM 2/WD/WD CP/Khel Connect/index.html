<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Khel Connect</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="Khel Connect Logo">
            </div>
            <p>Sports Department, Government of India</p>
            <img src="images/government-emblem.png" alt="Government of India Emblem" class="govt-emblem">
        </div>
    </header>

    <div class="container">
        <div class="login-form">
            <h2>Login to Khel Connect</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Khel Connect - Sports Department, Government of India</p>
        </div>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
