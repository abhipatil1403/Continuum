<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <title>Bootstrap Grid Example</title> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
rel="stylesheet"> 
</head> 
<body> 
 
  <div class="container"> <!-- Bootstrap container for padding and alignment --> 
    <div class="row"> <!-- Start a new row --> 
       
      <div class="col-sm-6 col-md-4">Column 1</div> <!-- 6 columns on small screens, 4 on 
medium+ --> 
      <div class="col-sm-6 col-md-4">Column 2</div> 
      <div class="col-sm-12 col-md-4">Column 3</div> <!-- Full width on small screens --> 
 
    </div> 
  </div> 
 
</body> 
</html>
