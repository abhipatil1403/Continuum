<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="container mt-4">
        <div class="row">
          <div class="col-lg-4 col-md-6 col-sm-12 column">Column 1</div>
          <div class="col-lg-4 col-md-6 col-sm-12 column">Column 1</div>
          <div class="col-lg-4 col-md-6 col-sm-12 column">Column 1</div>
        </div>
        <div class="row">
          <div class="col-lg-6 col-md-6 col-sm-12 column">Column 2</div>
          <div class="col-lg-6 col-md-6 col-sm-12 column">Column 2</div>
        </div>
        <div class="row">
          <div class="col-lg-3 col-md-6 col-sm-12 column">Column 3</div>
          <div class="col-lg-3 col-md-6 col-sm-12 column">Column 3</div>
          <div class="col-lg-3 col-md-6 col-sm-12 column">Column 3</div>
          <div class="col-lg-3 col-md-6 col-sm-12 column">Column 3</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>



<!--Xs screens less tha 576 px				        for container(max-width is none or auto)
Sm screens equal to or greater than 576 px		for container(max-width is 540 px)
Md screens equal to or greater than 768 px		for container(max-width is 720 px)
Lg screens equal to or greater than 992 px		for container(max-width is 960 px)
Xl screens equal to or greater than 1200 px		for container(max-width is 1140 px)
Xxl screens equal to or greater than 1400 px  for container(max-width is 1320 px)
 -->
